# Salin ke .github/workflows/han.sip.yml di repo kamu.
# Pin npx ke commit SHA (bukan tag yang bisa digeser).
# Pin actions ke commit SHA. Komentar = versi yang di-pin.
name: han.sip

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  ronda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: ronda malam
        run: npx --yes github:ganezha/kotak-kecil#211cc004f3486a602f89cd50e11ffb5f6dad7c8b -- --quiet .

      - name: SARIF
        if: always()
        run: npx --yes github:ganezha/kotak-kecil#211cc004f3486a602f89cd50e11ffb5f6dad7c8b -- --sarif . > han.sip.sarif

      - name: upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        continue-on-error: true
        with:
          sarif_file: han.sip.sarif
          wait-for-processing: false
