# Salin ke .github/workflows/han.sip.yml di repo kamu.
# Pin opsional: ganti github:ganezha/kotak-kecil menjadi
# github:ganezha/kotak-kecil#v0.4.0
name: han.sip

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  ronda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: ronda malam
        run: npx --yes github:ganezha/kotak-kecil -- --quiet .

      - name: SARIF
        if: always()
        run: npx --yes github:ganezha/kotak-kecil -- --sarif . > han.sip.sarif

      - name: upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: han.sip.sarif
          wait-for-processing: false
