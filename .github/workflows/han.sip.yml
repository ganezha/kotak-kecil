name: han.sip

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  ronda:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: tes
        run: node --test tes/*.test.mjs
      - name: ronda malam
        run: node han.sip/cli.mjs .
      - name: jejak
        run: node jejak/cli.mjs
      - name: SARIF
        if: always() && matrix.node == '22'
        run: node han.sip/cli.mjs --sarif . > han.sip.sarif
      - name: upload SARIF
        if: always() && matrix.node == '22'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        with:
          sarif_file: han.sip.sarif
          wait-for-processing: false
